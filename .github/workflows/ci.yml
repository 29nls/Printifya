name: CI

# Gerbang mutu untuk setiap push dan pull request.
#
# Sengaja terpisah dari `release.yml`. Alur rilis dipicu oleh tag, jadi tanpa
# berkas ini kegagalan tes baru terlihat saat APK hendak dibuat — terlambat, dan
# tanpa apa pun yang menahan push sebelumnya. `release.yml` dibiarkan apa adanya
# agar rilis tetap dapat dijalankan meski ada tes yang belum diperbaiki.

on:
  push:
  pull_request:
  workflow_dispatch:

# Push ke sebuah branch dan pull request dari branch yang sama memakai
# `github.ref` yang berbeda, sehingga tanpa grup ini keduanya berjalan
# bersamaan untuk commit yang sama dan meninggalkan dua status check di PR.
# Dikunci pada nama branch agar hanya menjalankan yang terbaru.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tes, dan build
    # Tanpa langkah khusus citra: Node dan npm datang dari setup-node, dan job ini
    # tidak menyentuh paket sistem. Migrasi label ubuntu-latest ke Ubuntu 26.04
    # (19 Okt–19 Nov 2026) karena itu tidak mengubah apa pun di sini — yang
    # bergantung pada isi citra hanya job Android di release.yml.
    runs-on: ubuntu-latest
    steps:
      # Node 24 di kedua action: versi @v4-nya masih menargetkan Node 20 yang
      # sudah deprecated di runner GitHub.
      - name: Checkout code
        uses: actions/checkout@v7

      # Node 24, bukan 22: package-lock.json dibuat oleh npm 12 (bawaan Node 24),
      # sedangkan npm 10 di Node 22 menolaknya dengan galat
      # "Missing: @esbuild/... from lock file" — kegagalan CI yang tidak
      # mencerminkan masalah kode, dan hanya muncul di runner.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # `npm ci`, bukan `npm install`: versi dependensi persis mengikuti
      # package-lock.json, dan lockfile yang melenceng dari package.json gagal
      # di langkah ini alih-alih menghasilkan build yang berbeda dari lokal.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web assets
        run: npm run build

  android-canary:
    name: Bangun APK rilis (tanpa terbit)
    # Canary: menjalankan alur rilis yang sesungguhnya — pemasangan SDK, cap sync,
    # Gradle assembleRelease — pada setiap push ke main, bukan pada saat tag
    # sedang dipotong. Job ini memakai berkas workflow rilis lewat workflow_call,
    # bukan menyalin langkahnya, supaya yang diuji benar-benar jalur rilis.
    # `publish` bawaan workflow_call adalah false sehingga GitHub Release tidak
    # pernah tersentuh; hanya push tag dan dispatch yang boleh menerbitkan.
    # Hanya di main: pull request tidak perlu membayar build Android.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      publish: false
    # `contents: write`, bukan `read`: GitHub memvalidasi izin job pemanggil
    # terhadap izin yang diminta berkas yang dipanggil, bukan mengambil
    # irisan keduanya — dengan `read` di sini workflow gagal sebelum job dimulai
    # ("The workflow is requesting 'contents: write', but is only allowed
    # 'contents: read'"). Karena `publish` false, tidak ada langkah yang memakai
    # izin tulis itu; hanya step Create Release yang dilewati.
    permissions:
      contents: write
