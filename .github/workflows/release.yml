name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.0)"
        required: true
        type: string
      # Dua input berikut dipakai untuk menguji seluruh alur rilis tanpa
      # menerbitkan apa pun: `runner` menjalankan job di citra lain (mis.
      # ubuntu-26.04, pengganti ubuntu-latest mulai 19 Okt 2026), `publish: false`
      # menahan langkah Create Release agar aset rilis yang sudah ada tidak ditimpa.
      runner:
        description: "Runner label, mis. ubuntu-26.04 untuk menguji citra berikutnya"
        required: false
        default: "ubuntu-latest"
        type: string
      publish:
        description: "Terbitkan GitHub Release setelah APK terbangun"
        required: false
        default: true
        type: boolean
  # Dipakai job canary di ci.yml: langkah yang sama persis dijalankan pada setiap
  # push ke main, tetapi `publish` bawaannya false — pemanggil harus memintanya
  # dengan sadar sebelum ada rilis yang benar-benar terbit.
  workflow_call:
    inputs:
      version:
        description: "Versi untuk changelog; kosong = dari tag atau package.json"
        required: false
        type: string
      runner:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string
      publish:
        description: "Terbitkan GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    # Pada push tag `inputs.runner` kosong, sehingga `||` mengembalikannya ke
    # ubuntu-latest; hanya workflow_dispatch yang bisa memilih runner lain.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    
    steps:
      # Semua action di berkas ini memakai runtime Node 24. Versi sebelumnya
      # (checkout@v4, setup-node@v4, setup-java@v4, setup-android@v3,
      # upload-artifact@v4, action-gh-release@v1) menargetkan Node 20 yang sudah
      # deprecated di runner GitHub dan dipaksa jalan di Node 24.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # `packages: ""` bukan kelalaian: action ini hanya dipakai untuk memasang
      # cmdline-tools terbaru, menerima lisensi, dan menaruh `sdkmanager` di PATH.
      # Daftar bawaan @v3 ("tools platform-tools") berisi paket `tools` yang sudah
      # dihapus dari repositori SDK, sehingga sdkmanager gagal ("Failed to find
      # package 'tools'") sebelum APK sempat dibangun. @v4 sudah memperbaiki
      # bawaannya, tetapi paket tetap dipasang di langkah sendiri supaya isi SDK
      # tidak bergantung pada default action mana pun.
      #
      # Untuk tag lama: GitHub membaca berkas workflow ini dari commit yang di-tag,
      # bukan dari `main`. Tag yang dibuat sebelum perbaikan di atas (mis. v1.5.0)
      # karena itu selalu menjalankan versi lama dan tetap gagal walau dijalankan
      # ulang — rilis atau perbaikan untuk tag seperti itu harus dijalankan lewat
      # `workflow_dispatch` dari `main`, bukan lewat re-run pada tag.
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # Paket yang dibutuhkan build dipasang eksplisit, bukan lewat daftar bawaan
      # action: `compileSdk 36` di android/variables.gradle tidak berubah,
      # sedangkan daftar bawaan action mengikuti keputusan Google.
      # Kalau AGP 8.13.0 (android/build.gradle) meminta build-tools atau platform
      # lain, Gradle memasangnya sendiri karena lisensi sudah diterima di atas.
      # Tidak ada jalur SDK yang di-hardcode, jadi langkah ini tidak ikut berubah
      # saat citra runner berganti (ubuntu-latest → Ubuntu 26.04).
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Install dependencies
        run: npm install

      # Versi datang dari input (dispatch atau pemanggilan canary), dari nama tag
      # (push tag), atau dari package.json saat pemanggil tidak memilih versi.
      # `inputs` dipakai, bukan `github.event.inputs`: konteks itu kosong pada
      # pemanggilan workflow_call dari ci.yml.
      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versi yang dipakai: $VERSION"

      - name: Generate changelog from commits
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          bash scripts/generate-changelog.sh "${{ steps.version.outputs.version }}" \
            --notes-file .release-notes.md
          
          # Save changelog for CHANGELOG.md update
          bash scripts/generate-changelog.sh "${{ steps.version.outputs.version }}" \
            > /tmp/changelog-entry.md

      - name: Update CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to Printifya will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Prepend new entry after header using temp file
          ENTRY=$(cat /tmp/changelog-entry.md)
          HEADER="# Changelog\n\nAll notable changes to Printifya will be documented in this file.\n\n"
          REMAINDER=$(sed '1,4d' CHANGELOG.md)
          {
            printf "# Changelog\n\n"
            echo "$ENTRY"
            echo "$REMAINDER"
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Typecheck
        run: npm run typecheck

      - name: Build web assets
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find APK file
        id: apk
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          # Prefer signed release over unsigned
          APK_FILE=$(find "$APK_DIR" -name "*.apk" ! -name "*unsigned*" | head -1 || \
                     find "$APK_DIR" -name "*.apk" | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found"
            exit 1
          fi
          
          # Copy to a predictable name
          cp "$APK_FILE" "$APK_DIR/Printifya.apk"
          echo "apk_path=$APK_DIR/Printifya.apk" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename "$APK_FILE")" >> $GITHUB_OUTPUT
          
          APK_SIZE=$(stat -f%z "$APK_DIR/Printifya.apk" 2>/dev/null || stat -c%s "$APK_DIR/Printifya.apk" 2>/dev/null || echo "unknown")
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $(basename "$APK_FILE") ($APK_SIZE bytes)"

      # Push tag selalu menerbitkan; pemanggilan manual (dispatch atau canary CI)
      # hanya menerbitkan bila `publish` diminta secara eksplisit. Kondisinya
      # ditulis utuh dan tidak bergantung pada jenis event pemanggil, karena pada
      # workflow_call `github.event_name` adalah event pemanggil itu sendiri.
      - name: Create Release
        id: release
        if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Printifya ${{ steps.version.outputs.version }}
          body_path: .release-notes.md
          files: |
            ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          # `github.token`, bukan `secrets.GITHUB_TOKEN`: saat workflow ini
          # dipanggil lewat workflow_call (canary di ci.yml), secret itu belum
          # tentu diteruskan pemanggil, sedangkan `github.token` selalu ada.
          GITHUB_TOKEN: ${{ github.token }}

      # Jaring pengaman untuk push tag: bila kondisi di atas nanti salah diedit,
      # job gagal di sini alih-alih meninggalkan tag yang diam-diam tanpa rilis —
      # pemikiran yang tidak terlihat jauh lebih mahal daripada satu langkah ini.
      - name: Pastikan rilis tag benar-benar terbit
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          if [ "${{ steps.release.outcome }}" != "success" ]; then
            echo "::error::Push tag ${{ github.ref_name }} tidak menerbitkan rilis (Create Release: ${{ steps.release.outcome }})"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Printifya-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** ${{ steps.apk.outputs.apk_name }} ($(( ${{ steps.apk.outputs.apk_size }} / 1048576 )) MB)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** [GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Changelog:** Auto-generated from conventional commits" >> $GITHUB_STEP_SUMMARY
