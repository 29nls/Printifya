name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # `packages: ""` bukan kelalaian: action ini hanya dipakai untuk memasang
      # cmdline-tools terbaru, menerima lisensi, dan menaruh `sdkmanager` di PATH.
      # Daftar bawaan @v3 ("tools platform-tools") berisi paket `tools` yang sudah
      # dihapus dari repositori SDK, sehingga sdkmanager gagal ("Failed to find
      # package 'tools'") sebelum APK sempat dibangun. Paket dipasang di langkah
      # berikutnya, bukan di sini.
      #
      # Untuk tag lama: GitHub membaca berkas workflow ini dari commit yang di-tag,
      # bukan dari `main`. Tag yang dibuat sebelum perbaikan di atas (mis. v1.5.0)
      # karena itu selalu menjalankan versi lama dan tetap gagal walau dijalankan
      # ulang — rilis atau perbaikan untuk tag seperti itu harus dijalankan lewat
      # `workflow_dispatch` dari `main`, bukan lewat re-run pada tag.
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # Paket yang dibutuhkan build dipasang eksplisit, bukan lewat daftar bawaan
      # action: `compileSdk 36` di android/variables.gradle tidak berubah,
      # sedangkan daftar bawaan action mengikuti keputusan Google.
      # Kalau AGP 8.13.0 (android/build.gradle) meminta build-tools atau platform
      # lain, Gradle memasangnya sendiri karena lisensi sudah diterima di atas.
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Install dependencies
        run: npm install

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog from commits
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          bash scripts/generate-changelog.sh "${{ steps.version.outputs.version }}" \
            --notes-file .release-notes.md
          
          # Save changelog for CHANGELOG.md update
          bash scripts/generate-changelog.sh "${{ steps.version.outputs.version }}" \
            > /tmp/changelog-entry.md

      - name: Update CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to Printifya will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Prepend new entry after header using temp file
          ENTRY=$(cat /tmp/changelog-entry.md)
          HEADER="# Changelog\n\nAll notable changes to Printifya will be documented in this file.\n\n"
          REMAINDER=$(sed '1,4d' CHANGELOG.md)
          {
            printf "# Changelog\n\n"
            echo "$ENTRY"
            echo "$REMAINDER"
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Typecheck
        run: npm run typecheck

      - name: Build web assets
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find APK file
        id: apk
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          # Prefer signed release over unsigned
          APK_FILE=$(find "$APK_DIR" -name "*.apk" ! -name "*unsigned*" | head -1 || \
                     find "$APK_DIR" -name "*.apk" | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found"
            exit 1
          fi
          
          # Copy to a predictable name
          cp "$APK_FILE" "$APK_DIR/Printifya.apk"
          echo "apk_path=$APK_DIR/Printifya.apk" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename "$APK_FILE")" >> $GITHUB_OUTPUT
          
          APK_SIZE=$(stat -f%z "$APK_DIR/Printifya.apk" 2>/dev/null || stat -c%s "$APK_DIR/Printifya.apk" 2>/dev/null || echo "unknown")
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $(basename "$APK_FILE") ($APK_SIZE bytes)"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Printifya ${{ steps.version.outputs.version }}
          body_path: .release-notes.md
          files: |
            ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Printifya-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** ${{ steps.apk.outputs.apk_name }} ($(( ${{ steps.apk.outputs.apk_size }} / 1048576 )) MB)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** [GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Changelog:** Auto-generated from conventional commits" >> $GITHUB_STEP_SUMMARY
